<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticação | Supabase</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Importação do Supabase via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2 id="form-title">Entrar</h2>
            <form id="auth-form">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required placeholder="seu@email.com">
                </div>
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" required placeholder="********">
                </div>
                <button type="submit" id="submit-btn">Fazer Login</button>
            </form>
            <div class="toggle-container">
                <span id="toggle-text">Ainda não tem uma conta?</span>
                <button type="button" id="toggle-btn">Criar Conta</button>
            </div>
        </div>
    </div>
    <!-- Script da Aplicação -->
    <script src="script.js"></script>
</body>
</html>
